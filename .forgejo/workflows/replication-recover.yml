name: Replication Recovery

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'TrueNAS replication task ID'
        required: true
        type: string
      task_name:
        description: 'Task name (optional fallback — live name is resolved from TrueNAS at runtime)'
        required: false
        type: string

# One recovery per task at a time — different tasks can recover in parallel
concurrency:
  group: replication-recover-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: truenas-runner
    steps:
      - name: Checkout repo (to get truenas_ws.py)
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pip
          python3 -m pip install websocket-client --break-system-packages

      # ─────────────────────────────────────────────
      # STEP 0 — Resolve task name from TrueNAS
      #
      # Fallback chain (never blocks recovery):
      #   1. Live name from TrueNAS via get-name
      #   2. task_name input if provided
      #   3. "Task <id>" as last resort
      #
      # Writes TASK_NAME to $GITHUB_ENV so all subsequent
      # steps pick it up automatically.
      # ─────────────────────────────────────────────
      - name: Resolve task name
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_NAME_FALLBACK: ${{ inputs.task_name }}
        run: |
          set -uo pipefail

          RESOLVED_NAME=""

          if python3 scripts/truenas_ws.py --action get-name --id "${TASK_ID}" > /tmp/name_out.txt 2>&1; then
            RESOLVED_NAME=$(cat /tmp/name_out.txt | tr -d '\n')
            echo "Resolved task name from TrueNAS: ${RESOLVED_NAME}"
          else
            echo "WARNING: get-name failed (exit $?), trying fallback"
            cat /tmp/name_out.txt || true
          fi

          if [ -z "${RESOLVED_NAME}" ] && [ -n "${TASK_NAME_FALLBACK}" ]; then
            RESOLVED_NAME="${TASK_NAME_FALLBACK}"
            echo "Using provided task_name fallback: ${RESOLVED_NAME}"
          fi

          if [ -z "${RESOLVED_NAME}" ]; then
            RESOLVED_NAME="Task ${TASK_ID}"
            echo "Using last-resort name: ${RESOLVED_NAME}"
          fi

          # Multiline-safe write — guards against names containing %, \r, or \n
          # which would corrupt a plain `echo "KEY=value" >> $GITHUB_ENV` assignment.
          printf 'TASK_NAME<<EOF_TASK_NAME\n%s\nEOF_TASK_NAME\n' "${RESOLVED_NAME}" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      # STEP 1 — Check task is enabled
      # ─────────────────────────────────────────────
      - name: Check task is enabled
        id: enabled_check
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -uo pipefail

          set +e
          python3 scripts/truenas_ws.py --action check-enabled --id "${TASK_ID}" > /tmp/enabled_out.txt 2>&1
          EXIT_CODE=$?
          set -e

          echo "check-enabled exit code: ${EXIT_CODE}"
          cat /tmp/enabled_out.txt

          if [ $EXIT_CODE -eq 3 ]; then
            echo "task_enabled=false" >> $GITHUB_OUTPUT
            curl -sf \
              -H "Title: ⚠️ Recovery Skipped — Task Disabled" \
              -H "Priority: default" \
              -H "Tags: warning,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}) is disabled in TrueNAS. Enable the task to allow recovery." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "task_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "task_enabled=false" >> $GITHUB_OUTPUT
            curl -sf \
              -H "Title: ⚠️ Recovery Aborted — API Error" \
              -H "Priority: high" \
              -H "Tags: warning,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): could not check enabled state (exit ${EXIT_CODE}). Check TrueNAS API." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          fi
          exit 0

      # ─────────────────────────────────────────────
      # STEP 2 — Check task is not already running
      # ─────────────────────────────────────────────
      - name: Check task is not already running
        id: running_check
        if: steps.enabled_check.outputs.task_enabled == 'true'
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -uo pipefail
          TASK_NAME="${TASK_NAME:-Task ${TASK_ID}}"

          set +e
          python3 scripts/truenas_ws.py --action get-state --id "${TASK_ID}" > /tmp/state_out.txt 2>&1
          EXIT_CODE=$?
          set -e

          STATE=$(cat /tmp/state_out.txt | tr -d '\n')
          echo "Task ${TASK_ID} '${TASK_NAME}' current state: ${STATE} (exit ${EXIT_CODE})"

          if [ $EXIT_CODE -eq 2 ]; then
            # get-state exits 2 when state is FAILED or ERROR — expected, proceed with recovery
            echo "task_already_running=false" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 1 ]; then
            # API error — could not determine state, abort
            echo "task_already_running=true" >> $GITHUB_OUTPUT
            curl -sf \
              -H "Title: ⚠️ Recovery Aborted — API Error" \
              -H "Priority: high" \
              -H "Tags: warning,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): could not check running state (exit ${EXIT_CODE}). Check TrueNAS API." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          elif [ "$STATE" = "RUNNING" ] || [ "$STATE" = "PENDING" ]; then
            echo "task_already_running=true" >> $GITHUB_OUTPUT
            curl -sf \
              -H "Title: ⚠️ Recovery Aborted — Task Already Running" \
              -H "Priority: default" \
              -H "Tags: warning,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}) is already ${STATE}. Recovery aborted — no action taken." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          else
            echo "task_already_running=false" >> $GITHUB_OUTPUT
          fi

      # ─────────────────────────────────────────────
      # STEP 3 — Register task as recovering
      # Uses per-task variable RECOVERING_<id> — no shared state, no race condition
      # ─────────────────────────────────────────────
      - name: Register task as recovering
        if: |
          steps.enabled_check.outputs.task_enabled == 'true' &&
          steps.running_check.outputs.task_already_running == 'false'
        env:
          CI_URL: ${{ secrets.CI_URL }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CI_REPO: ${{ secrets.CI_REPO }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -uo pipefail

          VAR_NAME="RECOVERING_${TASK_ID}"

          # POST to named resource is upsert in Forgejo v15 — creates or updates, always 204.
          # POST to collection (/variables) is 405. PUT is update-only, 404 if missing.
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CI_URL}/api/v1/repos/${CI_REPO}/actions/variables/${VAR_NAME}" \
            -d "{\"value\": \"recovering\"}" 2>/dev/null) || HTTP_STATUS="000"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "WARNING: Failed to set ${VAR_NAME} (HTTP ${HTTP_STATUS}) — proceeding anyway"
          fi

          echo "Task ${TASK_ID} '${TASK_NAME}' registered as recovering (variable: ${VAR_NAME})."

      # ─────────────────────────────────────────────
      # STEP 4 — Notify: failure detected
      # ─────────────────────────────────────────────
      - name: Notify — failure detected, starting recovery
        if: |
          steps.enabled_check.outputs.task_enabled == 'true' &&
          steps.running_check.outputs.task_already_running == 'false'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -uo pipefail
          curl -sf \
            -H "Title: ❌ Replication Failed — Recovery Starting" \
            -H "Priority: high" \
            -H "Tags: x,truenas" \
            -d "Task '${TASK_NAME}' (ID ${TASK_ID}) failed. Starting retry sequence (up to 3 attempts)." \
            "${NTFY_URL}/${NTFY_TOPIC}" || true

      # ─────────────────────────────────────────────
      # STEP 5 — Retry loop (3 attempts, incremental)
      # ─────────────────────────────────────────────
      - name: Retry incremental replication (3 attempts)
        id: retry
        if: |
          steps.enabled_check.outputs.task_enabled == 'true' &&
          steps.running_check.outputs.task_already_running == 'false'
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -uo pipefail

          MAX_RETRIES=3
          WAIT_BETWEEN=120
          POLL_INTERVAL=30
          MAX_WAIT=3600

          run_and_wait() {
            local attempt=$1
            echo "--- Attempt ${attempt}/${MAX_RETRIES}: triggering task ID ${TASK_ID} ---"

            set +e
            python3 scripts/truenas_ws.py --action run-task --id "${TASK_ID}" > /tmp/run_out.txt 2>&1
            RUN_EXIT=$?
            set -e
            cat /tmp/run_out.txt
            if [ $RUN_EXIT -ne 0 ]; then
              echo "  ERROR: run-task failed (exit ${RUN_EXIT}) — treating as attempt failure"
              return 1
            fi

            local elapsed=0
            while [ $elapsed -lt $MAX_WAIT ]; do
              sleep $POLL_INTERVAL
              elapsed=$((elapsed + POLL_INTERVAL))

              set +e
              python3 scripts/truenas_ws.py --action get-state --id "${TASK_ID}" > /tmp/state_out.txt 2>&1
              STATE_EXIT=$?
              set -e
              STATE=$(cat /tmp/state_out.txt | tr -d '\n')
              echo "  [${elapsed}s] State: ${STATE} (exit ${STATE_EXIT})"

              if [ $STATE_EXIT -eq 1 ] && [ "$STATE" != "FAILED" ] && [ "$STATE" != "ERROR" ]; then
                echo "  API error during polling — will retry poll next interval"
                continue
              fi

              case "$STATE" in
                FINISHED|SUCCESS) return 0 ;;
                FAILED|ERROR)     return 1 ;;
                RUNNING|PENDING)  continue ;;
                *) echo "  Unexpected state: ${STATE}" ;;
              esac
            done

            echo "  Timed out after ${MAX_WAIT}s"
            return 1
          }

          SUCCESS=false
          for attempt in 1 2 3; do
            if run_and_wait $attempt; then
              echo "Attempt ${attempt} succeeded."
              SUCCESS=true
              break
            else
              echo "Attempt ${attempt} failed."
              if [ $attempt -lt $MAX_RETRIES ]; then
                curl -sf \
                  -H "Title: 🔄 Retry ${attempt}/${MAX_RETRIES} Failed" \
                  -H "Priority: default" \
                  -H "Tags: arrows_counterclockwise,truenas" \
                  -d "Task '${TASK_NAME}' (ID ${TASK_ID}): incremental retry ${attempt} of ${MAX_RETRIES} failed. Retrying in ${WAIT_BETWEEN}s." \
                  "${NTFY_URL}/${NTFY_TOPIC}" || true
                sleep $WAIT_BETWEEN
              fi
            fi
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "retry_result=success" >> $GITHUB_OUTPUT
          else
            echo "retry_result=failed" >> $GITHUB_OUTPUT
          fi

      # ─────────────────────────────────────────────
      # STEP 6a — Retries succeeded
      # ─────────────────────────────────────────────
      - name: Notify — recovery succeeded
        if: steps.retry.outputs.retry_result == 'success'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -uo pipefail
          curl -sf \
            -H "Title: ✅ Replication Recovered" \
            -H "Priority: default" \
            -H "Tags: white_check_mark,truenas" \
            -d "Task '${TASK_NAME}' (ID ${TASK_ID}) recovered successfully via incremental retry." \
            "${NTFY_URL}/${NTFY_TOPIC}" || true

      # ─────────────────────────────────────────────
      # STEP 6b — All retries failed → escalate
      # ─────────────────────────────────────────────
      - name: Notify — escalating to full replication
        if: steps.retry.outputs.retry_result == 'failed'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -uo pipefail
          curl -sf \
            -H "Title: 🚨 Escalating — Switching to Full Replication" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,truenas" \
            -d "Task '${TASK_NAME}' (ID ${TASK_ID}): all 3 incremental retries failed. Switching to full replication — this may take a long time." \
            "${NTFY_URL}/${NTFY_TOPIC}" || true

      # ─────────────────────────────────────────────
      # STEP 6c — Switch to full replication and run
      #
      # Outputs:
      #   full_result:     success | failed | timeout | setup_failed
      #   policy_switched: true    (only set when set-full actually succeeded)
      #
      # setup_failed: set-full itself failed — TrueNAS policy was NOT changed.
      #   Alert already sent here. No downstream alert step fires for this
      #   value, preventing duplicate notifications.
      #
      # failed: set-full succeeded but the run or poll ended in failure.
      #   policy_switched=true is guaranteed on this path.
      #
      # policy_switched is the gate for all revert logic below.
      # ─────────────────────────────────────────────
      - name: Switch to full replication and run
        id: full_replication
        if: steps.retry.outputs.retry_result == 'failed'
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CI_URL: ${{ secrets.CI_URL }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CI_REPO: ${{ secrets.CI_REPO }}
        run: |
          set -uo pipefail

          POLL_INTERVAL=60
          MAX_WAIT=86400

          echo "Switching task ${TASK_ID} '${TASK_NAME}' to full replication..."
          set +e
          python3 scripts/truenas_ws.py --action set-full --id "${TASK_ID}" > /tmp/setfull_out.txt 2>&1
          SETFULL_EXIT=$?
          set -e
          cat /tmp/setfull_out.txt

          if [ $SETFULL_EXIT -ne 0 ]; then
            echo "ERROR: set-full failed (exit ${SETFULL_EXIT}) — TrueNAS policy was NOT changed"
            curl -sf \
              -H "Title: 🆘 Full Replication Setup Failed" \
              -H "Priority: urgent" \
              -H "Tags: sos,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): could not switch to full replication. API error (exit ${SETFULL_EXIT}). Task policy was not changed. Manual intervention required." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
            echo "full_result=setup_failed" >> $GITHUB_OUTPUT
            # policy_switched intentionally NOT set — revert must not run
            exit 0
          fi

          # set-full succeeded — policy is now changed in TrueNAS
          # TASK_POLICY_<id> has been written to Forgejo by set-full
          echo "policy_switched=true" >> $GITHUB_OUTPUT

          echo "Triggering full replication run..."
          set +e
          python3 scripts/truenas_ws.py --action run-task --id "${TASK_ID}" > /tmp/run_out.txt 2>&1
          RUN_EXIT=$?
          set -e
          cat /tmp/run_out.txt

          if [ $RUN_EXIT -ne 0 ]; then
            echo "ERROR: run-task failed (exit ${RUN_EXIT})"
            echo "full_result=failed" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Polling for completion (max ${MAX_WAIT}s)..."
          elapsed=0
          FULL_RESULT="timeout"

          while [ $elapsed -lt $MAX_WAIT ]; do
            sleep $POLL_INTERVAL
            elapsed=$((elapsed + POLL_INTERVAL))

            set +e
            python3 scripts/truenas_ws.py --action get-state --id "${TASK_ID}" > /tmp/state_out.txt 2>&1
            STATE_EXIT=$?
            set -e
            STATE=$(cat /tmp/state_out.txt | tr -d '\n')
            echo "  [${elapsed}s] Full replication state: ${STATE} (exit ${STATE_EXIT})"

            if [ $STATE_EXIT -eq 1 ] && [ "$STATE" != "FAILED" ] && [ "$STATE" != "ERROR" ]; then
              echo "  API error during polling — will retry next interval"
              continue
            fi

            case "$STATE" in
              FINISHED|SUCCESS) FULL_RESULT="success"; break ;;
              FAILED|ERROR)     FULL_RESULT="failed";  break ;;
              RUNNING|PENDING)  continue ;;
            esac
          done

          echo "full_result=${FULL_RESULT}" >> $GITHUB_OUTPUT

      # ─────────────────────────────────────────────
      # STEP 7a — Full succeeded → revert to original policy
      # ─────────────────────────────────────────────
      - name: Revert to incremental replication
        id: revert
        if: steps.full_replication.outputs.full_result == 'success'
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CI_URL: ${{ secrets.CI_URL }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CI_REPO: ${{ secrets.CI_REPO }}
        run: |
          set -uo pipefail

          echo "Reverting task ${TASK_ID} '${TASK_NAME}' back to original replication policy..."
          set +e
          python3 scripts/truenas_ws.py --action set-incremental --id "${TASK_ID}" > /tmp/setinc_out.txt 2>&1
          SETINC_EXIT=$?
          set -e
          cat /tmp/setinc_out.txt

          if [ $SETINC_EXIT -ne 0 ]; then
            echo "revert_result=failed" >> $GITHUB_OUTPUT
            echo "ERROR: set-incremental failed (exit ${SETINC_EXIT})"
            curl -sf \
              -H "Title: ⚠️ Revert Failed — Manual Check Required" \
              -H "Priority: high" \
              -H "Tags: warning,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): full replication succeeded but could not revert to original policy. Task is still in full replication mode. Check TrueNAS and restore using TASK_POLICY_${TASK_ID} variable in Forgejo." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          else
            echo "revert_result=success" >> $GITHUB_OUTPUT
          fi

      # Notify only when BOTH full replication AND revert succeeded
      - name: Notify — full replication succeeded, reverted to incremental
        if: |
          steps.full_replication.outputs.full_result == 'success' &&
          steps.revert.outputs.revert_result == 'success'
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -uo pipefail
          curl -sf \
            -H "Title: ✅ Full Replication Succeeded" \
            -H "Priority: default" \
            -H "Tags: white_check_mark,truenas" \
            -d "Task '${TASK_NAME}' (ID ${TASK_ID}): full replication completed and task reverted to original replication policy." \
            "${NTFY_URL}/${NTFY_TOPIC}" || true

      # ─────────────────────────────────────────────
      # STEP 7b — Full failed → attempt revert, then alert
      #
      # Only runs when policy_switched=true, meaning set-full actually
      # succeeded before the run or poll failed. Safe to attempt revert
      # because TASK_POLICY_<id> is guaranteed to exist in Forgejo.
      # ─────────────────────────────────────────────
      - name: Revert after full replication failure
        id: revert_on_failure
        if: |
          steps.full_replication.outputs.full_result == 'failed' &&
          steps.full_replication.outputs.policy_switched == 'true'
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CI_URL: ${{ secrets.CI_URL }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CI_REPO: ${{ secrets.CI_REPO }}
        run: |
          set -uo pipefail

          echo "Full replication failed — attempting to revert task ${TASK_ID} '${TASK_NAME}' to original policy..."
          set +e
          python3 scripts/truenas_ws.py --action set-incremental --id "${TASK_ID}" > /tmp/setinc_out.txt 2>&1
          SETINC_EXIT=$?
          set -e
          cat /tmp/setinc_out.txt

          if [ $SETINC_EXIT -ne 0 ]; then
            echo "revert_on_failure_result=failed" >> $GITHUB_OUTPUT
            echo "ERROR: set-incremental failed (exit ${SETINC_EXIT})"
            curl -sf \
              -H "Title: 🆘 CRITICAL — Full Replication Failed, Revert Also Failed" \
              -H "Priority: urgent" \
              -H "Tags: sos,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): full replication failed AND could not revert to original policy. Task is still in full replication mode. Manual intervention required. Restore using TASK_POLICY_${TASK_ID} variable in Forgejo." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          else
            echo "revert_on_failure_result=success" >> $GITHUB_OUTPUT
            curl -sf \
              -H "Title: 🆘 CRITICAL — Full Replication Failed" \
              -H "Priority: urgent" \
              -H "Tags: sos,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): full replication failed. Task policy has been reverted to original settings. Manual intervention required — check TrueNAS at ${TRUENAS_HOST}." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
          fi

      # ─────────────────────────────────────────────
      # STEP 7c — Timeout → probe task state, revert if safe
      #
      # A timeout only means the workflow stopped waiting — it does NOT prove
      # the TrueNAS job has stopped. This step probes via replication.query,
      # which reads task-level state, not the specific job instance launched
      # by replication.run. This is a pragmatic heuristic at 24h timeout, not
      # a guarantee of exact job state.
      #
      # Emits a single timeout_outcome covering the full decision tree:
      #
      #   completed_reverted     → task shows done, policy restored      → green
      #   failed_reverted        → task shows failure, policy restored    → red
      #   failed_revert_failed   → task shows failure, policy stuck       → red
      #   no_revert_running      → task still active, no revert           → red
      #   no_revert_unknown      → API error, state unknown, no revert    → red
      # ─────────────────────────────────────────────
      - name: Handle timeout — probe task state and revert if safe
        id: timeout_handler
        if: steps.full_replication.outputs.full_result == 'timeout'
        env:
          TRUENAS_HOST: ${{ secrets.TRUENAS_HOST }}
          TRUENAS_PORT: ${{ secrets.TRUENAS_PORT }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CI_URL: ${{ secrets.CI_URL }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CI_REPO: ${{ secrets.CI_REPO }}
        run: |
          set -uo pipefail

          POLICY_NOTE=""
          if [ "${{ steps.full_replication.outputs.policy_switched }}" = "true" ]; then
            POLICY_NOTE=" Task policy was switched to full replication. TASK_POLICY_${TASK_ID} variable in Forgejo contains the original settings."
          fi

          echo "Timeout reached — probing task state for task ${TASK_ID} '${TASK_NAME}'..."
          echo "(Note: reads replication.query task state — heuristic inference, not exact job state.)"
          set +e
          python3 scripts/truenas_ws.py --action get-state --id "${TASK_ID}" > /tmp/probe_out.txt 2>&1
          PROBE_EXIT=$?
          set -e
          PROBE_STATE=$(cat /tmp/probe_out.txt | tr -d '\n')
          echo "Probe result: state=${PROBE_STATE} exit=${PROBE_EXIT}"

          # API error — cannot determine state, assume still running, do not revert
          if [ $PROBE_EXIT -eq 1 ] && [ "$PROBE_STATE" != "FAILED" ] && [ "$PROBE_STATE" != "ERROR" ]; then
            echo "timeout_outcome=no_revert_unknown" >> $GITHUB_OUTPUT
            curl -sf \
              -H "Title: 🆘 CRITICAL — Full Replication Timeout, State Unknown" \
              -H "Priority: urgent" \
              -H "Tags: sos,truenas" \
              -d "Task '${TASK_NAME}' (ID ${TASK_ID}): workflow timed out and could not probe task state. Assuming job may still be running — task policy NOT reverted.${POLICY_NOTE} Manual check required at ${TRUENAS_HOST}." \
              "${NTFY_URL}/${NTFY_TOPIC}" || true
            exit 0
          fi

          attempt_revert() {
            local reason=$1
            echo "Attempting revert (reason: ${reason})..."
            set +e
            python3 scripts/truenas_ws.py --action set-incremental --id "${TASK_ID}" > /tmp/setinc_out.txt 2>&1
            SETINC_EXIT=$?
            set -e
            cat /tmp/setinc_out.txt

            if [ $SETINC_EXIT -ne 0 ]; then
              echo "ERROR: set-incremental failed (exit ${SETINC_EXIT})"
              echo "timeout_outcome=failed_revert_failed" >> $GITHUB_OUTPUT
              curl -sf \
                -H "Title: 🆘 CRITICAL — Timeout Revert Failed" \
                -H "Priority: urgent" \
                -H "Tags: sos,truenas" \
                -d "Task '${TASK_NAME}' (ID ${TASK_ID}): workflow timed out, task has ended (${reason}), but could not revert policy. Task is still in full replication mode. Restore using TASK_POLICY_${TASK_ID} variable in Forgejo." \
                "${NTFY_URL}/${NTFY_TOPIC}" || true
            elif [ "$reason" = "completed" ]; then
              echo "timeout_outcome=completed_reverted" >> $GITHUB_OUTPUT
              curl -sf \
                -H "Title: ✅ Full Replication Succeeded (Late Detected)" \
                -H "Priority: default" \
                -H "Tags: white_check_mark,truenas" \
                -d "Task '${TASK_NAME}' (ID ${TASK_ID}): workflow timed out but task state shows completion. Task reverted to original replication policy." \
                "${NTFY_URL}/${NTFY_TOPIC}" || true
            else
              echo "timeout_outcome=failed_reverted" >> $GITHUB_OUTPUT
              curl -sf \
                -H "Title: 🆘 CRITICAL — Full Replication Failed" \
                -H "Priority: urgent" \
                -H "Tags: sos,truenas" \
                -d "Task '${TASK_NAME}' (ID ${TASK_ID}): workflow timed out and task state shows failure. Task policy reverted to original settings. Manual intervention required — check TrueNAS at ${TRUENAS_HOST}." \
                "${NTFY_URL}/${NTFY_TOPIC}" || true
            fi
          }

          case "$PROBE_STATE" in
            FINISHED|SUCCESS)
              # Task state shows completion — treat as success, revert
              attempt_revert "completed"
              ;;
            FAILED|ERROR)
              # Task state shows failure — treat as failed, attempt revert
              attempt_revert "failed"
              ;;
            RUNNING|PENDING|*)
              # Task still active (or unexpected state) — do not revert
              echo "timeout_outcome=no_revert_running" >> $GITHUB_OUTPUT
              curl -sf \
                -H "Title: 🆘 CRITICAL — Full Replication Timeout, Task Still Running" \
                -H "Priority: urgent" \
                -H "Tags: sos,truenas" \
                -d "Task '${TASK_NAME}' (ID ${TASK_ID}): workflow timed out but task is still ${PROBE_STATE} in TrueNAS. Task policy NOT reverted — do not change settings while job is running.${POLICY_NOTE} Check TrueNAS at ${TRUENAS_HOST} and revert manually when complete." \
                "${NTFY_URL}/${NTFY_TOPIC}" || true
              ;;
          esac

      # ─────────────────────────────────────────────
      # STEP 8 — Always: unregister task from recovering
      # Deletes per-task variable RECOVERING_<id>
      # TASK_POLICY_<id> is intentionally NOT deleted here on failure/timeout
      # paths — it remains in Forgejo as the manual recovery reference.
      # set-incremental deletes it only after a confirmed successful revert.
      # ─────────────────────────────────────────────
      - name: Unregister task from recovering
        if: always()
        env:
          CI_URL: ${{ secrets.CI_URL }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          CI_REPO: ${{ secrets.CI_REPO }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -uo pipefail

          VAR_NAME="RECOVERING_${TASK_ID}"

          curl -sf \
            -X DELETE \
            -H "Authorization: Bearer ${CI_TOKEN}" \
            "${CI_URL}/api/v1/repos/${CI_REPO}/actions/variables/${VAR_NAME}" || true

          echo "Task ${TASK_ID} '${TASK_NAME}' unregistered (deleted variable: ${VAR_NAME})."

      # ─────────────────────────────────────────────
      # Final exit — fail the job red if any terminal failure occurred.
      #
      # Red conditions:
      #   full_result == failed        full escalation failed (revert attempted or not)
      #   full_result == setup_failed  set-full itself failed, policy never changed
      #   revert_result == failed      success path revert failed
      #   timeout_outcome == failed_reverted        job failed, cleanup succeeded
      #   timeout_outcome == failed_revert_failed   job failed, cleanup also failed
      #   timeout_outcome == no_revert_running      job still active, no revert possible
      #   timeout_outcome == no_revert_unknown      state unknown, no revert attempted
      #
      # Green conditions (no exit 1):
      #   retry_result == success                   incremental retry recovered
      #   full_result == success + revert == success full run succeeded and policy restored
      #   timeout_outcome == completed_reverted      late-detected success, policy restored
      # ─────────────────────────────────────────────
      - name: Fail job if critical failure or revert failed
        if: |
          steps.full_replication.outputs.full_result == 'failed' ||
          steps.full_replication.outputs.full_result == 'setup_failed' ||
          steps.revert.outputs.revert_result == 'failed' ||
          steps.timeout_handler.outputs.timeout_outcome == 'failed_reverted' ||
          steps.timeout_handler.outputs.timeout_outcome == 'failed_revert_failed' ||
          steps.timeout_handler.outputs.timeout_outcome == 'no_revert_running' ||
          steps.timeout_handler.outputs.timeout_outcome == 'no_revert_unknown'
        run: exit 1
